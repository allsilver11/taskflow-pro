<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-100 dark:bg-gray-950 min-h-screen font-sans transition-colors duration-200">

  <!-- 헤더 -->
  <header class="sticky top-0 z-10 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 shadow-sm">
    <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
      <h1 class="text-base font-semibold text-gray-900 dark:text-white tracking-tight">TaskFlow Pro</h1>
      <button id="theme-toggle" aria-label="테마 전환"
        class="min-h-[44px] min-w-[44px] flex items-center justify-center rounded-xl text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-lg">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <div class="max-w-2xl mx-auto px-4 py-6 space-y-5">

    <!-- 업무 추가 폼 -->
    <section class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md rounded-xl shadow-lg p-4">
      <h2 class="text-xs font-medium text-gray-400 dark:text-gray-500 uppercase tracking-wide mb-3">새 업무</h2>
      <form id="add-form" class="space-y-3" novalidate>
        <div>
          <input id="add-title" type="text" placeholder="업무 제목을 입력하세요" maxlength="200" autocomplete="off"
            class="w-full min-h-[44px] px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-colors" />
          <p id="add-title-error" class="hidden mt-1 text-xs text-red-500"></p>
        </div>
        <div class="flex gap-2">
          <input id="add-due-at" type="datetime-local"
            class="flex-1 min-h-[44px] min-w-0 px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-colors" />
          <select id="add-status"
            class="min-h-[44px] px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-colors">
            <option value="todo">할 일</option>
            <option value="in_progress">진행 중</option>
            <option value="done">완료</option>
          </select>
        </div>
        <button type="submit"
          class="w-full min-h-[44px] bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-medium rounded-xl transition-colors text-sm">
          추가
        </button>
      </form>
    </section>

    <!-- 업무 목록 -->
    <section>
      <div id="task-list" class="space-y-3"></div>
      <div id="empty-state" class="hidden text-center py-14">
        <p class="text-4xl mb-3">📋</p>
        <p class="text-sm text-gray-400 dark:text-gray-500">등록된 업무가 없습니다.</p>
      </div>
      <div id="error-state" class="hidden text-center py-14">
        <p class="text-4xl mb-3">⚠️</p>
        <p class="text-sm text-gray-400 dark:text-gray-500">서버에 연결할 수 없습니다.</p>
      </div>
    </section>

  </div>

  <!-- 수정 모달 -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4">
    <div id="modal-backdrop" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="relative w-full max-w-md bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="font-semibold text-gray-900 dark:text-white text-sm">업무 수정</h3>
        <button id="modal-close" aria-label="닫기"
          class="min-h-[44px] min-w-[44px] flex items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 rounded-xl transition-colors">✕</button>
      </div>
      <form id="edit-form" class="space-y-3" novalidate>
        <div>
          <input id="edit-title" type="text" placeholder="업무 제목" maxlength="200"
            class="w-full min-h-[44px] px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-colors" />
          <p id="edit-title-error" class="hidden mt-1 text-xs text-red-500"></p>
        </div>
        <textarea id="edit-description" placeholder="상세 설명 (선택)" rows="3"
          class="w-full px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-colors resize-none"></textarea>
        <div class="flex gap-2">
          <input id="edit-due-at" type="datetime-local"
            class="flex-1 min-h-[44px] min-w-0 px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-colors" />
          <select id="edit-status"
            class="min-h-[44px] px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-colors">
            <option value="todo">할 일</option>
            <option value="in_progress">진행 중</option>
            <option value="done">완료</option>
          </select>
        </div>
        <div class="flex gap-2 pt-1">
          <button type="button" id="modal-cancel"
            class="flex-1 min-h-[44px] rounded-xl border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 text-sm transition-colors">취소</button>
          <button type="submit"
            class="flex-1 min-h-[44px] bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-xl text-sm transition-colors">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 삭제 확인 다이얼로그 -->
  <div id="delete-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="relative bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-5 w-full max-w-xs space-y-4">
      <p class="text-gray-900 dark:text-white font-medium text-sm text-center">이 업무를 삭제하시겠습니까?</p>
      <div class="flex gap-2">
        <button id="delete-cancel"
          class="flex-1 min-h-[44px] rounded-xl border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 text-sm transition-colors">취소</button>
        <button id="delete-confirm"
          class="flex-1 min-h-[44px] bg-red-500 hover:bg-red-600 text-white font-medium rounded-xl text-sm transition-colors">삭제</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
